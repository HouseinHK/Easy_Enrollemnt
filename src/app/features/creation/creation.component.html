<div class="feature-container">
  <h2>Create New Course Session</h2>

  <form (ngSubmit)="add_button()" #courseForm="ngForm" class="form-grid">

    <div class="form-group full-width-field">
      <label for="course_code">Course Code</label>
      <input id="course_code" type="text" placeholder="e.g., GEN 101, MKT 200" [(ngModel)]="course_code" name="course_code" required>
    </div>

    <div class="form-group">
      <label for="section_number">Section Number</label>
      <input id="section_number" type="number" placeholder="e.g., 1, 2, 3" [(ngModel)]="section_number" name="section_number" required>
    </div>
    <div class="form-group">
      <label for="instructor">Instructor</label>
      <input id="instructor" type="text" placeholder="Enter instructor's name" [(ngModel)]="instructor" name="instructor" required>
    </div>
    
    <div class="form-group">
      <label for="campus">Campus</label>
      <select id="campus" [(ngModel)]="campus" name="campus" required>
        <option value="" disabled selected>Select a campus...</option>
        <option>Al Ain</option>
        <option>Abu Dhabi</option>
      </select>
    </div>
    <div class="form-group">
      <label for="expected_capacity">Expected Capacity</label>
      <select id="expected_capacity" [(ngModel)]="expected_capacity" name="expected_capacity" required>
        <option value="" disabled selected>Select capacity...</option>
        <option>Regular</option>
        <option>Large</option>
        <option>Mega</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="day_pattern">Day Pattern</label>
      <select id="day_pattern" [(ngModel)]="day_pattern" name="day_pattern" (change)="day()" required>
        <option value="" disabled selected>Select days...</option>
        <option>MW</option>
        <option>TR</option>
      </select>
    </div>
    <div class="form-group">
      <label for="time_slot">Time Slot</label>
      <select id="time_slot" [(ngModel)]="time_slot" name="time_slot" required [disabled]="slots.length === 0">
        <option value="" disabled selected>Select a time slot...</option>
        <option *ngFor="let slot of slots" [value]="slot.num">{{slot.time}}</option>
      </select>
    </div>

    <div class="form-footer">
      <button type="submit" class="btn btn-primary" [disabled]="!courseForm.valid">Add Course Session</button>
    </div>

  </form>

  <div class="notification-popup" *ngIf="showNotification">
    <div class="notification-content">
      <div class="notification-icon">✓</div>
      <div class="notification-message">Course successfully added!</div>
    </div>
  </div>
</div>
