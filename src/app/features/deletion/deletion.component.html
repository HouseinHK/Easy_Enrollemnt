<div class="feature-container">
  <h2>Search for Course Sessions</h2>
  <p class="subtitle">Fill in one or more fields to find specific course sessions.</p>

  <form (ngSubmit)="search_button()" #searchForm="ngForm" class="form-grid">

    <div class="form-group full-width-field">
      <label for="course_code">Course Code</label>
      <input id="course_code" type="text" placeholder="e.g., GEN 101" [(ngModel)]="course_code" name="course_code">
    </div>

    <div class="form-group">
      <label for="section_number">Section Number</label>
      <input id="section_number" type="number" placeholder="e.g., 1" [(ngModel)]="section_number" name="section_number">
    </div>
    <div class="form-group">
      <label for="instructor">Instructor</label>
      <input id="instructor" type="text" placeholder="Enter instructor's name" [(ngModel)]="instructor" name="instructor">
    </div>

    <div class="form-group">
      <label for="campus">Campus</label>
      <select id="campus" [(ngModel)]="campus" name="campus">
        <option value="" selected>Any Campus</option>
        <option>Al Ain</option>
        <option>Abu Dhabi</option>
      </select>
    </div>
    <div class="form-group">
      <label for="expected_capacity">Expected Capacity</label>
      <select id="expected_capacity" [(ngModel)]="expected_capacity" name="expected_capacity">
        <option value="" selected>Any Capacity</option>
        <option>Regular</option>
        <option>Large</option>
        <option>Mega</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="day_pattern">Day Pattern</label>
      <select id="day_pattern" [(ngModel)]="day_pattern" name="day_pattern" (change)="day()">
        <option value="" selected>Any Day Pattern</option>
        <option>MW</option>
        <option>TR</option>
      </select>
    </div>
    <div class="form-group">
      <label for="time_slot">Time Slot</label>
      <select id="time_slot" [(ngModel)]="time_slot" name="time_slot" [disabled]="slots.length === 0">
        <option value="" selected>Any Time Slot</option>
        <option *ngFor="let slot of slots" [value]="slot.num">{{slot.time}}</option>
      </select>
    </div>

    <div class="form-footer">
      <button type="submit" class="btn btn-primary">Search for Sessions</button>
    </div>
  </form>
</div>
